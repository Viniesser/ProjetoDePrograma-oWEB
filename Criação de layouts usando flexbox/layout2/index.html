<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Layout 2 - Flamengo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="bandeiramengo.jpg" alt="Logo" class="logo">
            <nav class="nav">
                <a href="#" class="nav-item">Nação</a>
                <a href="#" class="nav-item">FlaTV</a>
                <a href="#" class="nav-item">Lojas Oficiais</a>
            </nav>
        </div>
        <div class="header-right">
            <a href="#" class="nav-item">Login</a>
            <button class="btn-outline">Sócio Torcedor</button>
            <button class="btn-solid">Comprar Manto</button>
        </div>
    </header>

    <main class="main-content">
        <section class="left-panel">
            <h1 class="h1-text">O Mascote da Nação</h1>
            <p class="p-text">O Urubu é o símbolo da nossa raça e paixão. Representando mais de 40 milhões de corações rubro-negros, ele embala o time rumo às vitórias no Maracanã e no mundo inteiro.</p>
            <div class="action-group">
                <button class="btn-solid">Conheça a História</button>
                <button class="btn-outline">Baixar Papel de Parede</button>
            </div>
        </section>

        <section class="right-panel">
            <img src="logoMengo.jpg" alt="Mascote Flamengo" class="visual-img">
        </section>
    </main>
</body>
</html>
