<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Layout 3 - Flamengo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="nav-left">
            <img src="bandeiramengo.jpg" alt="Logo" class="logo">
            <nav class="nav">
                <a href="#">O Clube</a>
                <a href="#">Elenco</a>
                <a href="#">Títulos</a>
            </nav>
        </div>
        <div class="nav-right">
            <input type="text" placeholder="Buscar..." class="search-input">
            <a href="#" class="login-link">Entrar</a>
            <button class="btn-signup">Criar Conta</button>
        </div>
    </header>

    <main class="main-content">
        <h1 class="main-title">A Força da Nação Rubro-Negra</h1>
        <p class="sub-text">Faça parte da maior torcida do mundo. Receba notícias exclusivas, bastidores do Ninho do Urubu e promoções do Manto Sagrado direto na sua caixa de entrada.</p>
        
        <div class="form-group">
            <input type="email" placeholder="Digite seu e-mail" class="email-input">
            <button class="btn-submit">Cadastrar-se</button>
            <button class="btn-outline-white">Experimente a FlaTV+</button>
        </div>
    </main>
</body>
</html>
