<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Layout 1 - Flamengo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="bandeiramengo.jpg" alt="Logo Flamengo" class="logo">
        
        <nav class="nav">
            <a href="#" class="nav-item">Sócio Torcedor</a>
            <a href="#" class="nav-item">Ingressos</a>
            <a href="#" class="nav-item">Manto Sagrado</a>
            <a href="#" class="nav-item">Notícias</a>
        </nav>
        
        <button class="btn-primary">Seja Sócio</button>
    </header>

    <main class="main-content">
        <section class="left-panel">
            <h1 class="h1-text">A Maior Torcida do Mundo Faz a Diferença</h1>
            <p class="p-text">Junte-se ao Mengão e faça parte da nossa história. Garanta seu ingresso, compre o Manto e apoie o Mais Querido em busca de mais títulos!</p>
            <button class="btn-secondary">Comprar Ingressos</button>
        </section>

        <section class="right-panel">
            <img src="LibertadoresMengo.jpeg" alt="Campeões da Libertadores" class="hero-image">
        </section>
    </main>
</body>
</html>
