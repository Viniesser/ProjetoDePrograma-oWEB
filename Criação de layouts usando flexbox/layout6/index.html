<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Layout 6 - Grid Flamengo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <img src="bandeiramengo.jpg" alt="Logo" class="logo" />
      <div class="search-bar">
        <input type="text" placeholder="O que você procura?" />
      </div>
      <nav class="nav">
        <a href="#">Explore</a>
        <a href="#">Manto Sagrado</a>
        <a href="#">Ingressos</a>
      </nav>
      <div class="auth-buttons">
        <a href="#" class="login">Entrar</a>
        <button class="signup">Criar Conta</button>
      </div>
    </header>

    <div class="filters-section">
      <button class="btn-filter">Popular ▾</button>
      <nav class="categories">
        <a href="#" class="active">Futebol</a>
        <a href="#">Basquete</a>
        <a href="#">eSports</a>
        <a href="#">Feminino</a>
        <a href="#">Base</a>
      </nav>
      <button class="btn-filter">Filtros ▾</button>
    </div>

    <main class="grid-container">
      <article class="card">
        <img src="LibertadoresMengo.jpeg" alt="Libertadores" class="card-img" />
        <div class="card-footer">
          <span class="card-title">Glória Eterna</span>
          <span class="card-stats">❤️ 40M</span>
        </div>
      </article>
      <article class="card">
        <img src="Torcida-do-Flamengo.jpg" alt="Torcida" class="card-img" />
        <div class="card-footer">
          <span class="card-title">A Maior do Mundo</span>
          <span class="card-stats">❤️ 81M</span>
        </div>
      </article>
      <article class="card">
        <img src="logoMengo.jpg" alt="Mascote" class="card-img" />
        <div class="card-footer">
          <span class="card-title">Mascote Oficial</span>
          <span class="card-stats">❤️ 12K</span>
        </div>
      </article>
      <article class="card">
        <img src="flamengo.png" alt="Escudo" class="card-img" />
        <div class="card-footer">
          <span class="card-title">Escudo CRF</span>
          <span class="card-stats">❤️ 99K</span>
        </div>
      </article>
      <article class="card">
        <img src="LibertadoresMengo.jpeg" alt="Libertadores" class="card-img" />
        <div class="card-footer">
          <span class="card-title">Campeões 2022</span>
          <span class="card-stats">❤️ 40M</span>
        </div>
      </article>
      <article class="card">
        <img src="Torcida-do-Flamengo.jpg" alt="Torcida" class="card-img" />
        <div class="card-footer">
          <span class="card-title">Festa no Maraca</span>
          <span class="card-stats">❤️ 81M</span>
        </div>
      </article>
      <article class="card">
        <img src="logoMengo.jpg" alt="Mascote" class="card-img" />
        <div class="card-footer">
          <span class="card-title">Urubu Rei</span>
          <span class="card-stats">❤️ 12K</span>
        </div>
      </article>
      <article class="card">
        <img src="flamengo.png" alt="Escudo" class="card-img" />
        <div class="card-footer">
          <span class="card-title">Sempre Flamengo</span>
          <span class="card-stats">❤️ 99K</span>
        </div>
      </article>
    </main>
  </body>
</html>
